server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache control for static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Main entry
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle MPA pages specifically if needed, but try_files usually covers it.
    # Since we have /src/pages/chat/index.html mapping to /src/pages/chat/
    # in dev, but in build it is usually flattened or kept structure.
    # Vite build keeps structure in dist/.
    
    # Access to chat page
    location /src/pages/chat/ {
        try_files $uri $uri/index.html /src/pages/chat/index.html;
    }

    # Access to history page
    location /src/pages/history/ {
        try_files $uri $uri/index.html /src/pages/history/index.html;
    }
}
